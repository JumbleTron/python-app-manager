services:
  tool:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /workspace
    volumes:
      - .:/workspace
      - ./dist:/workspace/dist
    environment:
      PYTHONPATH: /workspace/src
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: app_test
      MYSQL_USER: app_test
      MYSQL_PASSWORD: app_test_password
    depends_on:
      mysql:
        condition: service_healthy
    command: pytest

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_test_password
      MYSQL_DATABASE: app_test
      MYSQL_USER: app_test
      MYSQL_PASSWORD: app_test_password
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -proot_test_password"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
