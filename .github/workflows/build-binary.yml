name: Build Ubuntu binary

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install -e '.[build]'

      - name: Build one-file executable
        run: pyinstaller --clean --noconfirm create-python-app.spec

      - name: Smoke test executable
        run: ./dist/create-python-app --version

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: create-python-app-ubuntu-24.04
          path: dist/create-python-app
