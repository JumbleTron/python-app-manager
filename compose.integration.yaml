services:
  integration-vps:
    build:
      context: .
      dockerfile: Dockerfile.integration
    privileged: true
    environment:
      container: docker
    tmpfs:
      - /run
      - /run/lock
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - ./dist:/dist:ro
      - ./scripts:/workspace/scripts:ro
      - ./tests:/workspace/tests:ro
    ports:
      - "127.0.0.1:18080:80"
